device: auto
output_dir: outputs/paper_ready_v3/mixed_v3_common
training:
  episodes: 50
  steps_per_episode: 64
scenario:
  n_leo: 16
  n_geo: 2
  n_ground: 5
  seed: 13
  arrival_rate: 6.0
  burst_prob: 0.22
  burst_multiplier: 5.0
  max_queue: 220.0
  queue_mode: single_queue
  deadline_threshold: 5.0
  leo_cpu_capacity: 2.8
  geo_cpu_capacity: 28.0
  ground_cpu_capacity: 40.0
  leo_energy_init: 100.0
  tx_power_max: 1.0
  bandwidth_max: 18.0
  isl_base_rate: 14.0
  geo_base_rate: 18.0
  ground_base_rate: 22.0
  local_prop_delay: 0.05
  isl_prop_delay: 0.25
  geo_prop_delay: 1.8
  ground_prop_delay: 0.55
  orbit_speed: 0.31
  visibility_threshold: 0.15
  edge_feature_dim: 4
  node_feature_dim: 16
  topology_mode: satedgesim_trace
  topology_trace_path: traces/satedgesim_real_dense_mixed_v2_seed13.jsonl
  topology_trace_repeat: true
  topology_trace_strict: true
  action_mask_enabled: true
  action_mask_mode: completion_safe
  action_mask_layer_mode: full
  enable_visibility_mask: true
  enable_completion_safe_mask: true
  enable_mobility_risk_mask: true
  mask_min_rate: 0.0001
  geo_coverage_width_rad: 2.35
  ground_coverage_width_rad: 1.4
  gateway_drift_rate: 0.17
  ground_backhaul_congestion: 0.25
  geo_backhaul_congestion: 0.12
  success_profile: paper_strict
  profile_name: satedgesim_trace_mixed_v3
  action_space_architecture: full
  min_link_survival_margin_sec: 0.0
  enable_geo: true
  enable_ground: true
  enable_isl: true
  enable_dynamic_skip_isl: true
  enable_gnn: true
  enable_lyapunov_reward: true
  enable_cross_layer_feedback: true
  export_physical_metrics: true
  delay_s_per_unit: 1.0
  energy_j_per_unit: 1.0
  queue_cycles_per_unit: 1.0
  cpu_ghz_per_unit: 1.0
  rate_mbps_per_unit: 1.0
  bandwidth_mbps_per_unit: 1.0
  power_w_per_unit: 1.0
  task_size_bits_per_unit: 1.0
  workload_cycles_per_unit: 1.0
  physical:
    enabled: true
    slot_duration_s: 1.0
    task_size_bits_mean: 1000000.0
    task_size_bits_std: 0.0
    cycles_per_bit_mean: 1000.0
    cycles_per_bit_std: 0.0
    metric_mode: dual
model:
  topology_encoder: static_gnn
  temporal:
    enabled: false
    type: gnn_gru
    history_len: 4
    hidden_dim: 128
algo:
  upper_algo: mappo
  lower_algo: maddpg
  encoder_mode: separate
  gnn_hidden_dim: 64
  policy_hidden_dim: 128
  ppo_update_mode: standard_ppo
  entropy_coef: 0.03
  entropy_coef_schedule: linear_decay
  eval_interval: 1
evaluation:
  deterministic_eval_mode: raw_argmax
  tie_break_eps: 0.05
  stochastic_seed: 13
  report_raw_argmax_always: true
experiment:
  split:
    train_seeds:
    - 13
    - 21
    - 34
    - 55
    - 89
    - 144
    - 233
    - 377
    val_seeds:
    - 610
    test_seeds:
    - 987
    - 1597
    allow_debug_seed_overlap: false
  paper_ready: true
