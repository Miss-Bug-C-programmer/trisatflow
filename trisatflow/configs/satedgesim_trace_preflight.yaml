total_episodes: 20
log_interval: 1
device: cpu
output_dir: outputs/preflight_trace_cpu
scenario:
  n_leo: 16
  n_geo: 2
  n_ground: 5
  episode_len: 64
  seed: 13

  arrival_rate: 6.0
  burst_prob: 0.22
  burst_multiplier: 5.0
  max_queue: 220.0
  deadline_threshold: 5.0

  leo_cpu_capacity: 2.8
  geo_cpu_capacity: 28.0
  ground_cpu_capacity: 40.0
  leo_energy_init: 100.0
  tx_power_max: 1.0
  bandwidth_max: 18.0

  isl_base_rate: 14.0
  geo_base_rate: 18.0
  ground_base_rate: 22.0
  local_prop_delay: 0.05
  isl_prop_delay: 0.25
  geo_prop_delay: 1.8
  ground_prop_delay: 0.55

  orbit_speed: 0.31
  visibility_threshold: 0.15
  edge_feature_dim: 4
  node_feature_dim: 12

  topology_mode: satedgesim_trace
  topology_trace_path: traces/satedgesim_real_dense_seed13.jsonl
  topology_trace_repeat: true
  topology_trace_strict: true
  action_mask_enabled: true
  mask_min_rate: 0.0001
  geo_coverage_width_rad: 2.35
  ground_coverage_width_rad: 1.40
  gateway_drift_rate: 0.17
  ground_backhaul_congestion: 0.25
  geo_backhaul_congestion: 0.12

  enable_geo: true
  enable_ground: true
  enable_isl: true
  enable_dynamic_skip_isl: true
  enable_gnn: true
  enable_lyapunov_reward: true
  enable_cross_layer_feedback: true
reward:
  delay: 1.0
  energy: 0.05
  queue: 0.10
  violation: 3.0
  infeasible: 5.0
  load_balance: 0.08
  lyapunov_v: 0.4
  offload_gain: 1.2
  local_queue_pressure: 0.8
  remote_feasible_bonus: 0.02
algo:
  upper_algo: mappo
  lower_algo: maddpg
  gnn_hidden_dim: 128
  policy_hidden_dim: 256
  gamma: 0.97
  gae_lambda: 0.92
  ppo_clip: 0.20
  entropy_coef: 0.06
  value_coef: 0.5
  upper_lr: 0.0003
  lower_lr: 0.0003
  critic_lr: 0.0007
  tau: 0.02
  exploration_noise: 0.18
  lower_batch_size: 128
  lower_warmup: 256
  upper_batch_size: 128
  upper_warmup: 256
  epsilon_start: 0.35
  epsilon_end: 0.05
  epsilon_decay_episodes: 80
  sac_alpha: 0.15
  sac_target_entropy_scale: 1.0
