device: cpu
output_dir: outputs/preflight_trace_mixed_v2_entropy_debug_cpu
training:
  episodes: 80
  steps_per_episode: 64
scenario:
  n_leo: 16
  n_geo: 2
  n_ground: 5
  seed: 13
  arrival_rate: 6.0
  burst_prob: 0.22
  burst_multiplier: 5.0
  max_queue: 220.0
  deadline_threshold: 5.0
  leo_cpu_capacity: 2.8
  geo_cpu_capacity: 28.0
  ground_cpu_capacity: 40.0
  leo_energy_init: 100.0
  tx_power_max: 1.0
  bandwidth_max: 18.0
  isl_base_rate: 14.0
  geo_base_rate: 18.0
  ground_base_rate: 22.0
  local_prop_delay: 0.05
  isl_prop_delay: 0.25
  geo_prop_delay: 1.8
  ground_prop_delay: 0.55
  orbit_speed: 0.31
  visibility_threshold: 0.15
  edge_feature_dim: 4
  node_feature_dim: 16
  observation_mode: shared_tier_summary
  topology_mode: satedgesim_trace
  topology_trace_path: traces/satedgesim_real_dense_mixed_v2_seed13.jsonl
  topology_trace_repeat: true
  topology_trace_strict: true
  action_mask_enabled: true
  mask_min_rate: 0.0001
