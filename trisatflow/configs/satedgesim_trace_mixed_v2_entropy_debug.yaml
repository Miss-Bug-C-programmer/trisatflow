  delay: 1.0
  energy: 0.05
  queue: 0.10
  violation: 3.0
  infeasible: 5.0
  load_balance: 0.08
  lyapunov_v: 0.4
  offload_gain: 1.0
  local_queue_pressure: 0.6
  remote_feasible_bonus: 0.02
  cost_normalization_enabled: true
  per_tier_cost_normalization: true
  action_balance_bonus: 0.02
  selected_when_visible_bonus: 0.01
  ground_congestion_penalty: 0.08
  geo_delay_penalty: 0.01
  local_queue_penalty: 0.03
  neighbor_link_penalty: 0.01
