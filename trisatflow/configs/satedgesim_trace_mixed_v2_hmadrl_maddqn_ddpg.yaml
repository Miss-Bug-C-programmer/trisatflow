# HMADRL-style baseline config: upper MADDQN + lower DDPG.
# This baseline intentionally excludes MAPPO clipped objective,
# centralized per-agent MAPPO critic, and cost_prior_ce.

total_episodes: 50
steps_per_episode: 64
log_interval: 1
device: cpu

scenario:
  n_leo: 16
  episode_len: 64
  seed: 13
  node_feature_dim: 20
  include_cost_features_in_obs: true
  observation_mode: shared_tier_summary
  topology_mode: satedgesim_trace
  topology_trace_path: traces/satedgesim_real_dense_mixed_v2_seed13.jsonl
  topology_trace_repeat: true
  topology_trace_strict: true
  action_mask_enabled: true
  obs_normalization_mode: trace_log_quantile
  obs_normalization_path: traces/obs_norm_mixed_v2_log_quantile.json
  # Architecture/profile metadata for experiment bookkeeping
  action_space_architecture: full
  action_mask_mode: mobility_safe
  success_profile: paper_strict
  profile_name: mobility_aware_main

reward:
  mode: oracle_aligned_cost
  use_oracle_cost_components: true
  include_energy: false
  include_failure_risk: false

algo:
  upper_algo: iql   # placeholder in current trainer; HMADRL runner uses MADDQNUpperAgent separately
  lower_algo: iddpg # DDPG-style lower baseline
  gnn_hidden_dim: 64
  policy_hidden_dim: 128
  gamma: 0.96
  upper_lr: 3.0e-4
  lower_lr: 3.0e-4
  critic_lr: 7.0e-4
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_episodes: 80
  policy_head: gnn_only

policy_regularization:
  enabled: false
  mode: none
  weight: 0.0
