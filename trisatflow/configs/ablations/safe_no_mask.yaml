extends: ../paper/satedgesim_trace_mixed_v3_safe.yaml

ablation:
  name: safe_no_mask
  main_ablation_deployable: true
  safety_operating_point: cost_safety_tradeoff
  allowed_contract_diff_paths:
    - environment.action_mask.mode
    - environment.action_mask.enabled
    - environment.action_mask.enable_visibility_mask
    - environment.action_mask.enable_completion_safe_mask
    - environment.action_mask.enable_mobility_risk_mask

observation_policy: safe_observable
include_cost_prior: false
include_diagnostic_features: false
observation:
  mode: safe_observable
  include_oracle_cost: false
  include_cost_prior_features: false
environment:
  action_mask:
    mode: none
    enabled: false
    enable_visibility_mask: false
    enable_completion_safe_mask: false
    enable_mobility_risk_mask: false
